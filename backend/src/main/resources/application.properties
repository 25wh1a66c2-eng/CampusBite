# ===================================================================
# CampusBite - Spring Boot Application Configuration
# ===================================================================
server.port=8080

# Database Configuration (MySQL)
# For local MySQL, ensure database 'campusbite_db' exists:
# CREATE DATABASE IF NOT EXISTS campusbite_db;
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/campusbite_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Optional fallback profile: If MySQL is not running locally,
# run with: --spring.profiles.active=dev to use H2 in-memory DB
# spring.h2.console.enabled=true
# spring.h2.console.path=/h2-console

# Jackson JSON Configuration
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.default-property-inclusion=non_null
